<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor AI - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#03060f;--surface:#0d1425;
      --border:rgba(80,140,255,.2);--accent:#3b82f6;--accent2:#60a5fa;
      --text:#e8edf8;--muted:#7a8aaa;--err:#ef4444;
    }
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;position:relative}
    h1,h2{font-family:'Syne',sans-serif}
    #bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
    .grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image:linear-gradient(rgba(59,130,246,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.04) 1px,transparent 1px);
      background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 100%)}
    .login-container{position:relative;z-index:10;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:1rem}
    .login-card{background:rgba(13,20,37,.92);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(20px);padding:1.5rem 1.8rem;width:100%;max-width:420px;box-shadow:0 32px 64px rgba(0,0,0,.4)}
    .logo-section{text-align:center;margin-bottom:1rem}
    .logo-img{width:56px;height:56px;border-radius:50%;object-fit:cover;margin-bottom:8px;border:2px solid rgba(80,140,255,.3);box-shadow:0 6px 20px rgba(59,130,246,.2)}
    .logo-heading{font-family:'Syne',sans-serif;font-size:1.35rem;font-weight:800;letter-spacing:-.3px}
    .logo-heading span{color:var(--accent2)}
    .logo-sub{font-size:.72rem;color:var(--muted);margin-top:2px}
    .tabs{display:flex;margin-bottom:1.2rem;border-bottom:1px solid rgba(80,140,255,.2)}
    .tab{flex:1;padding:.6rem 0;border:none;background:none;color:rgba(232,237,248,.4);font-family:'Syne',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:color .25s;border-bottom:2px solid transparent}
    .tab.active{color:#e8edf8;border-bottom-color:var(--accent)}
    .tab:hover:not(.active){color:rgba(232,237,248,.65)}
    .form{display:none}.form.active{display:block;animation:slideIn .25s ease}
    @keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .form-group{margin-bottom:.85rem}
    .form-group label{display:block;font-size:.76rem;font-weight:500;color:rgba(232,237,248,.7);margin-bottom:.25rem;letter-spacing:.3px}
    .form-group input{width:100%;background:rgba(13,20,37,.8);border:1px solid rgba(80,140,255,.25);border-radius:8px;padding:.6rem .8rem;color:#e8edf8;font-size:.84rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .25s,box-shadow .25s}
    .form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
    .form-group input::placeholder{color:rgba(122,138,170,.45)}
    .form-group input.input-error{border-color:var(--err)}
    .error{color:var(--err);font-size:.7rem;margin-top:.18rem;font-weight:500;min-height:0}

    .upload-zone{position:relative;border:2px dashed rgba(80,140,255,.25);border-radius:10px;padding:.85rem;text-align:center;cursor:pointer;transition:all .25s;overflow:hidden;height:80px;display:flex;align-items:center;justify-content:center}
    .upload-zone:hover{border-color:var(--accent);background:rgba(59,130,246,.04)}
    .upload-zone.has-file{border-style:solid;border-color:var(--accent);padding:0}
    .upload-zone .uz-icon{font-size:1.3rem;color:var(--muted);margin-bottom:3px}
    .upload-zone .uz-text{font-size:.78rem;color:var(--muted)}
    .upload-zone.has-file .uz-icon,.upload-zone.has-file .uz-text{display:none}
    .upload-zone .uz-preview{display:none;width:100%;height:100%;object-fit:cover;border-radius:8px}
    .upload-zone.has-file .uz-preview{display:block}
    #signupImage{position:absolute;top:-9999px;left:-9999px}
    .upload-zone .uz-remove{position:absolute;top:5px;right:5px;z-index:5;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.75);border:none;color:#fff;font-size:.6rem;cursor:pointer;display:none;align-items:center;justify-content:center;transition:background .2s}
    .upload-zone .uz-remove:hover{background:var(--err)}
    .upload-zone.has-file .uz-remove{display:flex}
    .upload-hint{font-size:.65rem;color:var(--muted);margin-top:4px;min-height:0}

    /* Storage warning bar */
    .storage-bar{
      display:none;margin-bottom:.8rem;padding:6px 10px;
      background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);
      border-radius:8px;font-size:.68rem;color:var(--err);
      align-items:center;justify-content:space-between;
    }
    .storage-bar.show{display:flex}
    .storage-bar button{
      background:none;border:1px solid rgba(239,68,68,.3);
      color:var(--err);border-radius:5px;padding:2px 8px;
      font-size:.65rem;font-family:'DM Sans',sans-serif;
      cursor:pointer;transition:all .2s;white-space:nowrap;
    }
    .storage-bar button:hover{background:rgba(239,68,68,.15)}

    .btn-primary{width:100%;background:linear-gradient(135deg,#3b82f6 0%,#60a5fa 100%);color:white;border:none;padding:.7rem;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.86rem;font-weight:500;cursor:pointer;transition:all .25s;margin-top:.2rem}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 25px rgba(59,130,246,.35)}
    .btn-primary:active{transform:translateY(0)}
    .toast{position:fixed;top:20px;right:20px;z-index:999;padding:10px 16px;border-radius:8px;font-size:.78rem;font-weight:600;color:#fff;transform:translateX(120%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-width:320px}
    .toast.show{transform:translateX(0)}
    .toast-ok{background:rgba(16,185,129,.92)}
    .toast-err{background:rgba(239,68,68,.92)}
    @media(max-width:480px){.login-card{padding:1.2rem 1.1rem}.logo-heading{font-size:1.2rem}.logo-img{width:46px;height:46px}}
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <div class="grid-overlay"></div>

  <div class="login-container">
    <div class="login-card">

      <div class="logo-section">
        <img class="logo-img" src="https://z-cdn-media.chatglm.cn/files/d14597eb-c852-4886-9f40-02e45359a007.jpg?auth_key=1876624090-bcaa0fc077884824839e3d011ecf8fdc-0-65551cf0d21aada0397325564a89c9c9" alt="Monitor AI" />
        <h1 class="logo-heading">Monitor <span>AI</span></h1>
        <p class="logo-sub">Intelligent monitoring & assessment platform</p>
      </div>

      <!-- Storage warning -->
      <div class="storage-bar" id="storageBar">
        <span id="storageText">Storage almost full</span>
        <button onclick="clearAllStorage()">Clear All Data</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="login">Sign In</button>
        <button class="tab" data-tab="signup">Create Account</button>
      </div>

      <div id="loginForm" class="form active">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" />
          <div id="loginEmailErr" class="error"></div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password" />
          <div id="loginPassErr" class="error"></div>
        </div>
        <button class="btn-primary" onclick="handleLogin()">Sign In</button>
      </div>

      <div id="signupForm" class="form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="John Doe" />
          <div id="signupNameErr" class="error"></div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="your@email.com" />
          <div id="signupEmailErr" class="error"></div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="Min 8 chars, A-Z, a-z, 0-9" />
          <div id="signupPassErr" class="error"></div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="signupConfirm" placeholder="Re-enter password" />
          <div id="signupConfirmErr" class="error"></div>
        </div>
        <div class="form-group">
          <label>Profile Picture</label>
          <input type="file" id="signupImage" accept="image/*" />
          <div class="upload-zone" id="uploadZone">
            <div class="uz-icon">&#128247;</div>
            <div class="uz-text">Click to upload or drag image here</div>
            <img class="uz-preview" id="uzPreview" src="" alt="Preview" />
            <button type="button" class="uz-remove" id="uzRemove">&times;</button>
          </div>
          <p class="upload-hint" id="uploadHint">JPG, PNG — max 5MB</p>
          <div id="signupImgErr" class="error"></div>
        </div>
        <button class="btn-primary" onclick="handleSignup()">Create Account</button>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ========== TABS ========== */
    document.querySelectorAll('.tab').forEach(function(tab){
      tab.addEventListener('click',function(){
        var target=this.getAttribute('data-tab');
        document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
        document.querySelectorAll('.form').forEach(function(f){f.classList.remove('active')});
        this.classList.add('active');
        document.getElementById(target+'Form').classList.add('active');
        clearErr();
      });
    });

    /* ========== STORAGE ========== */
    function lsGet(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
    function lsSet(k,v){
      try{localStorage.setItem(k,JSON.stringify(v));return true}
      catch(e){return false}
    }

    /* ========== TOAST ========== */
    function toast(m,t){
      var el=document.getElementById('toast');el.textContent=m;
      el.className='toast toast-'+(t||'ok')+' show';
      clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show')},3500);
    }

    /* ========== ERRORS ========== */
    function clearErr(){
      document.querySelectorAll('.error').forEach(function(e){e.textContent=''});
      document.querySelectorAll('.input-error').forEach(function(e){e.classList.remove('input-error')});
    }
    function err(inp,id,msg){
      var i=document.getElementById(inp);if(i)i.classList.add('input-error');
      var e=document.getElementById(id);if(e)e.textContent=msg;
    }

    /* ========== STORAGE HELPERS ========== */
    function getUsedKB(){
      var total=0;
      try{for(var i=0;i<localStorage.length;i++){total+=(localStorage.getItem(localStorage.key(i))||'').length}}catch(e){}
      return Math.round(total/1024);
    }

    /* Purana test data cleanup — _t ya _test id wale users */
    function cleanTestUsers(){
      var users=getUsers();
      var cleaned=users.filter(function(u){return u.id!=='_t'&&u.id!=='_test'});
      if(cleaned.length!==users.length){
        lsSet('ma_users',cleaned);
        return true;
      }
      return false;
    }

    /* Storage warning check */
    function checkStorage(){
      var kb=getUsedKB();
      var bar=document.getElementById('storageBar');
      var txt=document.getElementById('storageText');
      if(kb>4000){
        bar.classList.add('show');
        txt.textContent='Storage '+kb+' KB / ~5000 KB used';
      }else{
        bar.classList.remove('show');
      }
    }

    /* Clear all button */
    function clearAllStorage(){
      try{localStorage.clear()}catch(e){}
      document.getElementById('storageBar').classList.remove('show');
      upImg=null;
      document.getElementById('uzPreview').src='';
      zone.classList.remove('has-file');
      document.getElementById('uploadHint').textContent='JPG, PNG — max 5MB';
      fileIn.value='';
      toast('All data cleared — try uploading again','ok');
    }

    /* ========== UPLOAD ========== */
    var upImg=null;
    var zone=document.getElementById('uploadZone');
    var fileIn=document.getElementById('signupImage');

    zone.addEventListener('click',function(e){
      if(e.target.closest('#uzRemove'))return;
      fileIn.click();
    });

    fileIn.addEventListener('change',function(){
      if(this.files[0])processFile(this.files[0]);
      this.value='';
    });

    zone.addEventListener('dragover',function(e){e.preventDefault();e.stopPropagation();zone.style.borderColor='var(--accent)';zone.style.background='rgba(59,130,246,.06)'});
    zone.addEventListener('dragleave',function(e){e.preventDefault();e.stopPropagation();zone.style.borderColor='';zone.style.background=''});
    zone.addEventListener('drop',function(e){
      e.preventDefault();e.stopPropagation();zone.style.borderColor='';zone.style.background='';
      var f=e.dataTransfer.files[0];if(f)processFile(f);
    });

    function processFile(f){
      if(!f.type.startsWith('image/')){toast('Only image files allowed','err');return}
      if(f.size>5*1024*1024){toast('Image too large — max 5MB','err');return}

      /* Pehle cleanup karo purana test data */
      cleanTestUsers();

      var usedKB=getUsedKB();
      if(usedKB>4800){
        toast('Storage full ('+usedKB+' KB). Click "Clear All Data" above.','err');
        checkStorage();
        return;
      }

      var rd=new FileReader();
      rd.onload=function(ev){
        var img=new Image();
        img.onerror=function(){toast('Could not read this image','err')};
        img.onload=function(){
          /* 80x80, quality 0.5 — sharp rahegi, ~3-5KB */
          var c=document.createElement('canvas');c.width=80;c.height=80;
          var x=c.getContext('2d');
          var m=Math.min(img.width,img.height);
          x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,80,80);
          var d=c.toDataURL('image/jpeg',0.5);
          var kb=Math.round(d.length/1024);

          if(usedKB+kb>4900){
            toast('Not enough space ('+kb+' KB needed). Clear data first.','err');
            checkStorage();return;
          }

          upImg=d;
          document.getElementById('uzPreview').src=d;
          zone.classList.add('has-file');
          document.getElementById('uploadHint').textContent=f.name+' — '+kb+' KB';
          toast('Image ready','ok');
        };
        img.src=ev.target.result;
      };
      rd.readAsDataURL(f);
    }

    document.getElementById('uzRemove').addEventListener('click',function(e){
      e.stopPropagation();upImg=null;
      document.getElementById('uzPreview').src='';
      zone.classList.remove('has-file');
      document.getElementById('uploadHint').textContent='JPG, PNG — max 5MB';
      fileIn.value='';
    });

    /* ========== USERS ========== */
    function getUsers(){var d=lsGet('ma_users');return Array.isArray(d)?d:[]}
    function vEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)}

    /* ========== LOGIN ========== */
    function handleLogin(){
      clearErr();
      var em=document.getElementById('loginEmail').value.trim();
      var pw=document.getElementById('loginPassword').value;var ok=true;
      if(!em){err('loginEmail','loginEmailErr','Email is required');ok=false}
      else if(!vEmail(em)){err('loginEmail','loginEmailErr','Invalid email format');ok=false}
      if(!pw){err('loginPassword','loginPassErr','Password is required');ok=false}
      else if(pw.length<6){err('loginPassword','loginPassErr','Minimum 6 characters');ok=false}
      if(!ok)return;

      var users=getUsers(),user=null;
      for(var i=0;i<users.length;i++){if(users[i].email===em){user=users[i];break}}
      if(!user){err('loginEmail','loginEmailErr','No account with this email');return}
      if(user.password!==pw){err('loginPassword','loginPassErr','Incorrect password');return}

      user.loginCount=(user.loginCount||0)+1;user.lastLogin=new Date().toISOString();
      lsSet('ma_users',users);
      lsSet('ma_session',{userId:user.id,at:new Date().toISOString()});
      toast('Welcome back, '+user.name.split(' ')[0]+'!','ok');
      setTimeout(function(){window.location.href='dashboard.html'},600);
    }
    document.getElementById('loginPassword').addEventListener('keydown',function(e){if(e.key==='Enter')handleLogin()});
    document.getElementById('signupConfirm').addEventListener('keydown',function(e){if(e.key==='Enter')handleSignup()});

    /* ========== SIGNUP ========== */
    function handleSignup(){
      clearErr();
      var nm=document.getElementById('signupName').value.trim();
      var em=document.getElementById('signupEmail').value.trim().toLowerCase();
      var pw=document.getElementById('signupPassword').value;
      var cf=document.getElementById('signupConfirm').value;var ok=true;

      if(!nm){err('signupName','signupNameErr','Name is required');ok=false}
      else if(nm.length<2){err('signupName','signupNameErr','At least 2 characters');ok=false}
      else if(!/^[a-zA-Z\s]+$/.test(nm)){err('signupName','signupNameErr','Only letters and spaces');ok=false}

      if(!em){err('signupEmail','signupEmailErr','Email is required');ok=false}
      else if(!vEmail(em)){err('signupEmail','signupEmailErr','Invalid email format');ok=false}
      else{var us=getUsers(),dup=false;for(var i=0;i<us.length;i++){if(us[i].email===em){dup=true;break}}
        if(dup){err('signupEmail','signupEmailErr','This email is already registered');ok=false}}

      var pe='';
      if(!pw)pe='Password is required';
      else if(pw.length<8)pe='Minimum 8 characters';
      else if(!/[A-Z]/.test(pw))pe='Must contain an uppercase letter (A-Z)';
      else if(!/[a-z]/.test(pw))pe='Must contain a lowercase letter (a-z)';
      else if(!/[0-9]/.test(pw))pe='Must contain a number (0-9)';
      if(pe){err('signupPassword','signupPassErr',pe);ok=false}

      if(!cf){err('signupConfirm','signupConfirmErr','Confirm your password');ok=false}
      else if(pw!==cf){err('signupConfirm','signupConfirmErr','Passwords do not match');ok=false}
      if(!upImg){document.getElementById('signupImgErr').textContent='Upload a profile picture';ok=false}
      if(!ok)return;

      cleanTestUsers();
      var users=getUsers();
      var nu={id:'u_'+Date.now(),name:nm,email:em,password:pw,avatar:upImg,trustScore:10,loginCount:0,createdAt:new Date().toISOString()};
      users.push(nu);
      if(!lsSet('ma_users',users)){
        toast('Storage full — click "Clear All Data" above','err');
        checkStorage();return;
      }

      var vf=getUsers(),fd=false;
      for(var j=0;j<vf.length;j++){if(vf[j].id===nu.id){fd=true;break}}
      if(!fd){toast('Data not saved — storage issue','err');checkStorage();return}

      nu.loginCount=1;lsSet('ma_users',users);
      lsSet('ma_session',{userId:nu.id,at:new Date().toISOString()});
      toast('Account created!','ok');
      setTimeout(function(){window.location.href='dashboard.html'},600);
    }

    /* ========== PARTICLES ========== */
    var cv=document.getElementById('bg-canvas'),cx=cv.getContext('2d'),W,H,pts=[];
    function rsz(){W=cv.width=innerWidth;H=cv.height=innerHeight}
    function init(){pts=[];for(var i=0;i<80;i++)pts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,o:Math.random()*.5+.1})}
    function draw(){
      cx.clearRect(0,0,W,H);
      for(var i=0;i<pts.length;i++){for(var j=i+1;j<pts.length;j++){
        var dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<130){cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.strokeStyle='rgba(59,130,246,'+((1-d/130)*.12)+')';cx.lineWidth=.6;cx.stroke()}
      }}
      for(var k=0;k<pts.length;k++){var p=pts[k];cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle='rgba(96,165,250,'+p.o+')';cx.fill();p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0}
      requestAnimationFrame(draw);
    }
    addEventListener('resize',function(){rsz();init()});rsz();init();draw();

    /* ========== INIT ========== */
    (function(){
      /* Pehle purana test data saaf karo */
      cleanTestUsers();
      checkStorage();

      var s=lsGet('ma_session');
      if(s&&s.userId){
        var u=getUsers(),f=false;
        for(var i=0;i<u.length;i++){if(u[i].id===s.userId){f=true;break}}
        if(f){window.location.href='dashboard.html'}
      }
    })();
  </script>
</body>
</html>
