<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitor AI — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
  <style>
/* ══════════════════════════════════════════
   RESET & VARIABLES
══════════════════════════════════════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --deep:       #071520;
  --deep2:      #0A1F2C;
  --panel:      rgba(10,31,44,0.82);
  --panel2:     rgba(7,21,32,0.95);
  --accent:     #00F5D4;
  --accent2:    #00D4B8;
  --cyan:       #22D3EE;
  --blue:       #0EA5E9;
  --glow:       rgba(0,245,212,0.22);
  --glow2:      rgba(0,245,212,0.08);
  --text:       #E8F4F8;
  --text2:      #B8D4E0;
  --muted:      #6B9BAD;
  --muted2:     #4A7A8A;
  --border:     rgba(0,245,212,0.14);
  --border2:    rgba(0,245,212,0.28);
  --err:        #FF6B8A;
  --err-bg:     rgba(255,107,138,0.08);
  --err-border: rgba(255,107,138,0.25);
  --r:          14px;
  --rsm:        8px;
  --rxs:        5px;
}

html{height:100%;}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--deep);
  color:var(--text);
  min-height:100vh;
  min-height:100dvh;
  position:relative;
  overflow:hidden;
  cursor:none;
}

/* ══════════════════════════════════════════
   CUSTOM CURSOR
══════════════════════════════════════════ */
#cursor{
  position:fixed;width:8px;height:8px;
  background:var(--accent);border-radius:50%;
  pointer-events:none;z-index:9999;
  transform:translate(-50%,-50%);
  transition:width .25s ease,height .25s ease,background .25s ease;
  box-shadow:0 0 10px var(--accent),0 0 20px rgba(0,245,212,.5);
  mix-blend-mode:screen;
}
#cursor-ring{
  position:fixed;width:36px;height:36px;
  border:1px solid rgba(0,245,212,.4);
  border-radius:50%;pointer-events:none;z-index:9998;
  transform:translate(-50%,-50%);
  transition:width .18s cubic-bezier(.25,.46,.45,.94),
             height .18s cubic-bezier(.25,.46,.45,.94),
             border-color .18s ease;
}
body:has(a:hover) #cursor,
body:has(button:hover) #cursor,
body:has(input:hover) #cursor,
body:has(.upload-zone:hover) #cursor  { width:16px;height:16px;background:var(--cyan); }
body:has(a:hover) #cursor-ring,
body:has(button:hover) #cursor-ring,
body:has(input:hover) #cursor-ring,
body:has(.upload-zone:hover) #cursor-ring { width:52px;height:52px;border-color:rgba(34,211,238,.7); }

@media(max-width:768px){
  #cursor,#cursor-ring{display:none;}
  body{cursor:auto;}
}

/* ══════════════════════════════════════════
   LAYERED BACKGROUND
══════════════════════════════════════════ */
/* Animated gradient mesh */
.bg-mesh{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 60% at 15% 20%, rgba(0,245,212,.07) 0%,transparent 55%),
    radial-gradient(ellipse 60% 50% at 85% 75%, rgba(14,165,233,.08) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 50% 50%, rgba(0,245,212,.04) 0%,transparent 60%);
  animation:mesh-shift 20s ease-in-out infinite alternate;
}
@keyframes mesh-shift{
  0%  {opacity:.8;transform:scale(1)    rotate(0deg);}
  50% {opacity:1; transform:scale(1.05) rotate(.8deg);}
  100%{opacity:.7;transform:scale(.97)  rotate(-.5deg);}
}

/* Scanline texture */
.scanlines{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    transparent,transparent 2px,
    rgba(0,245,212,.009) 2px,rgba(0,245,212,.009) 4px
  );
  animation:scan 12s linear infinite;
}
@keyframes scan{0%{background-position:0 0;}100%{background-position:0 200px;}}

/* Canvas for particles */
#bg-canvas{position:fixed;inset:0;z-index:2;pointer-events:none;}

/* HUD corner accents */
.hud{position:fixed;z-index:3;pointer-events:none;width:36px;height:36px;opacity:.25;animation:hud-p 4s ease-in-out infinite;}
@keyframes hud-p{0%,100%{opacity:.25;}50%{opacity:.5;}}
.hud-tl{top:14px;left:14px;border-top:1px solid var(--accent);border-left:1px solid var(--accent);}
.hud-tr{top:14px;right:14px;border-top:1px solid var(--accent);border-right:1px solid var(--accent);}
.hud-bl{bottom:14px;left:14px;border-bottom:1px solid var(--accent);border-left:1px solid var(--accent);}
.hud-br{bottom:14px;right:14px;border-bottom:1px solid var(--accent);border-right:1px solid var(--accent);}

/* Floating geometry shapes */
.geo-wrap{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
.geo{position:absolute;opacity:0;animation:geo-float ease-in-out infinite;filter:blur(.5px);}
@keyframes geo-float{
  0%,100%{transform:translateY(0)     rotate(0deg)   scale(1);}
  33%     {transform:translateY(-18px) rotate(6deg)   scale(1.04);}
  66%     {transform:translateY(-8px)  rotate(-4deg)  scale(.96);}
}
.geo.ring{border-radius:50%;border:1px solid rgba(0,245,212,.13);box-shadow:0 0 16px rgba(0,245,212,.05);}
.geo.sqr {border:1px solid rgba(34,211,238,.09);border-radius:3px;}
.geo.dot {border-radius:50%;background:radial-gradient(circle,rgba(0,245,212,.28) 0%,transparent 70%);filter:blur(6px);}

.g1{width:100px;height:100px;top:10%; left:5%;  animation-duration:17s;animation-delay:0s;}
.g2{width:50px; height:50px; top:25%;right:7%;  animation-duration:21s;animation-delay:2s;}
.g3{width:160px;height:160px;top:65%;left:3%;   animation-duration:25s;animation-delay:1s;}
.g4{width:32px; height:32px; top:80%;right:10%; animation-duration:14s;animation-delay:3s;}
.g5{width:70px; height:70px; top:45%;right:3%;  animation-duration:19s;animation-delay:.5s;}
.g6{width:20px; height:20px; top:18%;left:50%;  animation-duration:12s;animation-delay:4s;}

/* ══════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════ */
.page-wrap{
  position:relative;z-index:10;
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:1.5rem;
}

/* ══════════════════════════════════════════
   LOGIN CARD
══════════════════════════════════════════ */
.card{
  width:100%;max-width:440px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:2rem 2.2rem;
  backdrop-filter:blur(28px) saturate(140%);
  -webkit-backdrop-filter:blur(28px) saturate(140%);
  box-shadow:
    0 0 0 1px rgba(0,245,212,.06),
    0 0 60px rgba(0,245,212,.06),
    0 32px 80px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(0,245,212,.08);
  animation:card-in .8s cubic-bezier(.22,1,.36,1) both;
  position:relative;overflow:hidden;
}
@keyframes card-in{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}

/* Top shimmer line */
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.6;
}
/* Inner glow */
.card::after{
  content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);
  width:260px;height:120px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,245,212,.06) 0%,transparent 70%);
  pointer-events:none;
}

/* ══════════════════════════════════════════
   LOGO / HEADER
══════════════════════════════════════════ */
.logo-section{text-align:center;margin-bottom:1.6rem;position:relative;z-index:1;}

.logo-icon-wrap{
  display:inline-flex;align-items:center;justify-content:center;
  width:52px;height:52px;
  background:linear-gradient(135deg,var(--accent),var(--blue));
  border-radius:12px;margin-bottom:.75rem;
  box-shadow:0 0 18px rgba(0,245,212,.4),0 0 40px rgba(0,245,212,.15);
  animation:icon-pulse 3s ease-in-out infinite;
}
@keyframes icon-pulse{
  0%,100%{box-shadow:0 0 18px rgba(0,245,212,.4),0 0 40px rgba(0,245,212,.15);}
  50%     {box-shadow:0 0 28px rgba(0,245,212,.6),0 0 60px rgba(0,245,212,.25);}
}
.logo-icon-wrap svg{width:24px;height:24px;}

.logo-heading{
  font-family:'Orbitron',sans-serif;
  font-size:1.25rem;font-weight:700;
  letter-spacing:2px;
  color:var(--text);
  text-shadow:0 0 20px rgba(0,245,212,.2);
}
.logo-heading span{
  background:linear-gradient(135deg,var(--accent),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.logo-sub{font-size:.72rem;color:var(--muted);margin-top:4px;letter-spacing:.5px;}

/* ══════════════════════════════════════════
   STORAGE WARNING
══════════════════════════════════════════ */
.storage-bar{
  display:none;margin-bottom:.9rem;padding:7px 11px;
  background:rgba(255,107,138,.07);
  border:1px solid rgba(255,107,138,.2);
  border-radius:var(--rsm);
  font-size:.68rem;color:var(--err);
  align-items:center;justify-content:space-between;gap:.5rem;
  position:relative;z-index:1;
}
.storage-bar.show{display:flex;}
.storage-bar button{
  background:none;border:1px solid rgba(255,107,138,.3);
  color:var(--err);border-radius:var(--rxs);padding:3px 9px;
  font-size:.65rem;font-family:'DM Sans',sans-serif;cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.storage-bar button:hover{background:rgba(255,107,138,.14);}

/* ══════════════════════════════════════════
   TABS
══════════════════════════════════════════ */
.tabs{
  display:flex;margin-bottom:1.4rem;
  border-bottom:1px solid var(--border);
  position:relative;z-index:1;
}
.tab{
  flex:1;padding:.55rem 0;border:none;background:none;
  font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:600;
  letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;
  transition:color .25s,border-color .25s;
  margin-bottom:-1px;
}
.tab.active{
  color:var(--accent);border-bottom-color:var(--accent);
  text-shadow:0 0 12px rgba(0,245,212,.35);
}
.tab:hover:not(.active){color:var(--text2);}

/* ══════════════════════════════════════════
   FORMS
══════════════════════════════════════════ */
.form{display:none;}
.form.active{display:block;animation:form-in .3s ease both;}
@keyframes form-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.form-group{margin-bottom:.9rem;position:relative;z-index:1;}

.form-group label{
  display:block;
  font-family:'Orbitron',sans-serif;
  font-size:.62rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);margin-bottom:.35rem;
}

.form-group input{
  width:100%;
  background:rgba(7,21,32,.7);
  border:1px solid var(--border);
  border-radius:var(--rsm);
  padding:.65rem .95rem;
  color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:.88rem;
  outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.form-group input::placeholder{color:var(--muted2);}
.form-group input:focus{
  border-color:rgba(0,245,212,.45);
  box-shadow:0 0 0 3px rgba(0,245,212,.09),0 0 16px rgba(0,245,212,.06);
  background:rgba(10,31,44,.9);
}
.form-group input.input-error{
  border-color:rgba(255,107,138,.45);
  box-shadow:0 0 0 2px rgba(255,107,138,.08);
}

.error{
  color:var(--err);font-size:.69rem;margin-top:.22rem;
  font-weight:500;min-height:0;letter-spacing:.2px;
}

/* ══════════════════════════════════════════
   UPLOAD ZONE
══════════════════════════════════════════ */
.upload-zone{
  position:relative;
  border:1.5px dashed rgba(0,245,212,.2);
  border-radius:var(--rsm);
  padding:.9rem;text-align:center;cursor:pointer;
  transition:all .25s;overflow:hidden;
  height:82px;display:flex;align-items:center;justify-content:center;
  background:rgba(0,245,212,.02);
}
.upload-zone:hover{
  border-color:rgba(0,245,212,.45);
  background:rgba(0,245,212,.04);
  box-shadow:0 0 16px rgba(0,245,212,.06);
}
.upload-zone.has-file{border-style:solid;border-color:rgba(0,245,212,.4);padding:0;}
.uz-icon{font-size:1.3rem;color:var(--muted);margin-bottom:3px;}
.uz-text{font-size:.76rem;color:var(--muted);letter-spacing:.3px;}
.upload-zone.has-file .uz-icon,
.upload-zone.has-file .uz-text{display:none;}
.uz-preview{display:none;width:100%;height:100%;object-fit:cover;border-radius:calc(var(--rsm) - 1px);}
.upload-zone.has-file .uz-preview{display:block;}
#signupImage{position:absolute;top:-9999px;left:-9999px;}
.uz-remove{
  position:absolute;top:5px;right:5px;z-index:5;
  width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.7);border:1px solid rgba(0,245,212,.3);
  color:var(--accent);font-size:.7rem;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s;
}
.uz-remove:hover{background:rgba(255,107,138,.4);border-color:var(--err);color:#fff;}
.upload-zone.has-file .uz-remove{display:flex;}
.upload-hint{font-size:.65rem;color:var(--muted2);margin-top:4px;}

/* ══════════════════════════════════════════
   PRIMARY BUTTON
══════════════════════════════════════════ */
.btn-primary{
  width:100%;
  background:linear-gradient(135deg,var(--accent) 0%,var(--cyan) 100%);
  color:var(--deep);
  border:none;
  padding:.75rem;
  border-radius:var(--rsm);
  font-family:'Orbitron',sans-serif;
  font-size:.76rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  cursor:none;
  margin-top:.35rem;
  position:relative;overflow:hidden;
  transition:box-shadow .3s,transform .2s;
  box-shadow:0 0 22px rgba(0,245,212,.35),0 4px 16px rgba(0,0,0,.3);
}
/* Shimmer sweep */
.btn-primary::after{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
  transition:left .55s ease;
}
.btn-primary:hover::after{left:150%;}
.btn-primary:hover{
  box-shadow:0 0 40px rgba(0,245,212,.6),0 0 80px rgba(0,245,212,.2),0 6px 20px rgba(0,0,0,.4);
  transform:translateY(-2px);
}
.btn-primary:active{transform:translateY(0);}

/* ══════════════════════════════════════════
   TOAST
══════════════════════════════════════════ */
.toast{
  position:fixed;top:22px;right:22px;z-index:999;
  padding:11px 18px;border-radius:var(--rsm);
  font-size:.78rem;font-weight:600;color:#fff;
  transform:translateX(130%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  max-width:300px;backdrop-filter:blur(12px);
  letter-spacing:.3px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.toast.show{transform:translateX(0);}
.toast-ok{
  background:rgba(0,245,212,.15);
  border:1px solid rgba(0,245,212,.3);
  color:var(--accent);
}
.toast-err{
  background:rgba(255,107,138,.12);
  border:1px solid rgba(255,107,138,.3);
  color:var(--err);
}

/* ══════════════════════════════════════════
   STATUS DOT — live indicator in header
══════════════════════════════════════════ */
.status-pill{
  display:inline-flex;align-items:center;gap:.4rem;
  background:rgba(0,245,212,.06);
  border:1px solid rgba(0,245,212,.18);
  border-radius:50px;padding:.22rem .65rem;
  font-size:.65rem;letter-spacing:.8px;color:var(--accent);
  margin-bottom:.6rem;
  font-family:'Orbitron',sans-serif;font-weight:500;
}
.status-dot{
  width:5px;height:5px;border-radius:50%;background:var(--accent);
  animation:s-pulse 2s ease-in-out infinite;
  box-shadow:0 0 6px var(--accent);
}
@keyframes s-pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.65);}}

/* ══════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════ */
@media(max-width:480px){
  .card{padding:1.4rem 1.3rem;}
  .geo-wrap{display:none;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}
  </style>
</head>
<body>

<!-- Background layers -->
<div class="bg-mesh"></div>
<div class="scanlines"></div>
<canvas id="bg-canvas"></canvas>

<!-- Custom cursor -->
<div id="cursor"></div>
<div id="cursor-ring"></div>

<!-- HUD corners -->
<div class="hud hud-tl"></div>
<div class="hud hud-tr"></div>
<div class="hud hud-bl"></div>
<div class="hud hud-br"></div>

<!-- Floating geometry -->
<div class="geo-wrap">
  <div class="geo ring g1"></div>
  <div class="geo ring g2"></div>
  <div class="geo dot  g3"></div>
  <div class="geo sqr  g4"></div>
  <div class="geo ring g5"></div>
  <div class="geo dot  g6"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- PAGE -->
<div class="page-wrap">
  <div class="card">

    <!-- Header -->
    <div class="logo-section">
      <div class="status-pill">
        <span class="status-dot"></span>System Online
      </div>
      <div class="logo-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="#071520" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16.5" y1="16.5" x2="22" y2="22"/>
          <line x1="11" y1="8" x2="11" y2="14"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </div>
      <h1 class="logo-heading">MONITOR <span>AI</span></h1>
      <p class="logo-sub">Intelligent monitoring &amp; assessment platform</p>
    </div>

    <!-- Storage warning -->
    <div class="storage-bar" id="storageBar">
      <span id="storageText">Storage almost full</span>
      <button onclick="clearAllStorage()">Clear All Data</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="login">Sign In</button>
      <button class="tab" data-tab="signup">Create Account</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm" class="form active">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="your@email.com"/>
        <div id="loginEmailErr" class="error"></div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password"/>
        <div id="loginPassErr" class="error"></div>
      </div>
      <button class="btn-primary" onclick="handleLogin()">Sign In</button>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" class="form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="John Doe"/>
        <div id="signupNameErr" class="error"></div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="your@email.com"/>
        <div id="signupEmailErr" class="error"></div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Min 8 chars, A-Z, a-z, 0-9"/>
        <div id="signupPassErr" class="error"></div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="Re-enter password"/>
        <div id="signupConfirmErr" class="error"></div>
      </div>
      <div class="form-group">
        <label>Profile Picture</label>
        <input type="file" id="signupImage" accept="image/*"/>
        <div class="upload-zone" id="uploadZone">
          <div>
            <div class="uz-icon">⬆</div>
            <div class="uz-text">Click to upload or drag image here</div>
          </div>
          <img class="uz-preview" id="uzPreview" src="" alt="Preview"/>
          <button type="button" class="uz-remove" id="uzRemove">✕</button>
        </div>
        <p class="upload-hint" id="uploadHint">JPG, PNG — max 5MB</p>
        <div id="signupImgErr" class="error"></div>
      </div>
      <button class="btn-primary" onclick="handleSignup()">Create Account</button>
    </div>

  </div>
</div>

<script>
/* ════════════════════════════════════════
   CUSTOM CURSOR
════════════════════════════════════════ */
const $cur  = document.getElementById('cursor');
const $ring = document.getElementById('cursor-ring');
let mX = 0, mY = 0, rX = 0, rY = 0;

document.addEventListener('mousemove', e => {
  mX = e.clientX; mY = e.clientY;
  $cur.style.left = mX + 'px';
  $cur.style.top  = mY + 'px';
});

(function loopRing() {
  rX += (mX - rX) * 0.11;
  rY += (mY - rY) * 0.11;
  $ring.style.left = rX + 'px';
  $ring.style.top  = rY + 'px';
  requestAnimationFrame(loopRing);
})();

/* ════════════════════════════════════════
   PARTICLE CANVAS — teal digital mesh
════════════════════════════════════════ */
const cv  = document.getElementById('bg-canvas');
const ctx = cv.getContext('2d');
let W, H, pts = [];
const N = 65;

function mkPt() {
  return {
    x:  Math.random() * W,
    y:  Math.random() * H,
    r:  Math.random() * 1.6 + .4,
    vx: (Math.random() - .5) * .25,
    vy: (Math.random() - .5) * .25,
    o:  Math.random() * .5 + .12,
    c:  Math.random() > .55 ? [34,211,238] : [0,245,212]
  };
}
function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
function initPts() { pts = Array.from({length: N}, mkPt); }

function draw() {
  ctx.clearRect(0, 0, W, H);
  // Network lines
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
      const d  = Math.sqrt(dx*dx + dy*dy);
      if (d < 148) {
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[j].x, pts[j].y);
        ctx.strokeStyle = `rgba(0,245,212,${(1 - d/148) * .08})`;
        ctx.lineWidth   = .65;
        ctx.stroke();
      }
    }
  }
  // Glowing dots
  pts.forEach(p => {
    // Outer glow halo
    const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 7);
    grd.addColorStop(0, `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${p.o * .38})`);
    grd.addColorStop(1, `rgba(${p.c[0]},${p.c[1]},${p.c[2]},0)`);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 7, 0, Math.PI * 2);
    ctx.fillStyle = grd; ctx.fill();
    // Core
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${p.o})`;
    ctx.fill();
    // Move
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
  });
  requestAnimationFrame(draw);
}

window.addEventListener('resize', () => { resize(); initPts(); });
resize(); initPts(); draw();

/* ════════════════════════════════════════
   GEO SHAPES — staggered reveal on load
════════════════════════════════════════ */
window.addEventListener('load', () => {
  document.querySelectorAll('.geo').forEach((g, i) => {
    setTimeout(() => {
      g.style.transition = 'opacity 1.5s ease';
      g.style.opacity    = '1';
    }, 400 + i * 200);
  });
});

/* ════════════════════════════════════════
   MOUSE PARALLAX — subtle geo drift
════════════════════════════════════════ */
let lx = 0, ly = 0;
document.addEventListener('mousemove', e => {
  const nx = (e.clientX / window.innerWidth  - .5) * 22;
  const ny = (e.clientY / window.innerHeight - .5) * 22;
  lx += (nx - lx) * .05; ly += (ny - ly) * .05;
  document.querySelectorAll('.geo').forEach((g, i) => {
    const f = (i % 2 === 0 ? 1 : -1) * (0.05 + i * .012);
    g.style.marginLeft = `${lx * f}px`;
    g.style.marginTop  = `${ly * f}px`;
  });
}, {passive: true});

/* ════════════════════════════════════════
   TABS
════════════════════════════════════════ */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', function () {
    const target = this.dataset.tab;
    document.querySelectorAll('.tab').forEach(t  => t.classList.remove('active'));
    document.querySelectorAll('.form').forEach(f  => f.classList.remove('active'));
    this.classList.add('active');
    document.getElementById(target + 'Form').classList.add('active');
    clearErr();
  });
});

/* ════════════════════════════════════════
   LOCAL STORAGE HELPERS
════════════════════════════════════════ */
function lsGet(k) {
  try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }
  catch(e) { return null; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e) { return false; }
}

/* ════════════════════════════════════════
   TOAST
════════════════════════════════════════ */
function toast(m, t) {
  const el = document.getElementById('toast');
  el.textContent = m;
  el.className   = 'toast toast-' + (t || 'ok') + ' show';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3500);
}

/* ════════════════════════════════════════
   ERRORS
════════════════════════════════════════ */
function clearErr() {
  document.querySelectorAll('.error').forEach(e => e.textContent = '');
  document.querySelectorAll('.input-error').forEach(e => e.classList.remove('input-error'));
}
function err(inp, id, msg) {
  const i = document.getElementById(inp); if (i) i.classList.add('input-error');
  const e = document.getElementById(id);  if (e) e.textContent = msg;
}

/* ════════════════════════════════════════
   STORAGE UTILS
════════════════════════════════════════ */
function getUsedKB() {
  let total = 0;
  try {
    for (let i = 0; i < localStorage.length; i++)
      total += (localStorage.getItem(localStorage.key(i)) || '').length;
  } catch(e) {}
  return Math.round(total / 1024);
}
function cleanTestUsers() {
  const users   = getUsers();
  const cleaned = users.filter(u => u.id !== '_t' && u.id !== '_test');
  if (cleaned.length !== users.length) { lsSet('ma_users', cleaned); return true; }
  return false;
}
function checkStorage() {
  const kb  = getUsedKB();
  const bar = document.getElementById('storageBar');
  const txt = document.getElementById('storageText');
  if (kb > 4000) {
    bar.classList.add('show');
    txt.textContent = 'Storage ' + kb + ' KB / ~5000 KB used';
  } else {
    bar.classList.remove('show');
  }
}
function clearAllStorage() {
  try { localStorage.clear(); } catch(e) {}
  document.getElementById('storageBar').classList.remove('show');
  upImg = null;
  document.getElementById('uzPreview').src = '';
  zone.classList.remove('has-file');
  document.getElementById('uploadHint').textContent = 'JPG, PNG — max 5MB';
  fileIn.value = '';
  toast('All data cleared — try uploading again', 'ok');
}

/* ════════════════════════════════════════
   UPLOAD
════════════════════════════════════════ */
let upImg  = null;
const zone  = document.getElementById('uploadZone');
const fileIn = document.getElementById('signupImage');

zone.addEventListener('click', e => { if (!e.target.closest('#uzRemove')) fileIn.click(); });
fileIn.addEventListener('change', function () { if (this.files[0]) processFile(this.files[0]); this.value = ''; });
zone.addEventListener('dragover', e => {
  e.preventDefault(); e.stopPropagation();
  zone.style.borderColor = 'rgba(0,245,212,.6)';
  zone.style.background  = 'rgba(0,245,212,.05)';
});
zone.addEventListener('dragleave', e => {
  e.preventDefault(); e.stopPropagation();
  zone.style.borderColor = ''; zone.style.background = '';
});
zone.addEventListener('drop', e => {
  e.preventDefault(); e.stopPropagation();
  zone.style.borderColor = ''; zone.style.background = '';
  const f = e.dataTransfer.files[0]; if (f) processFile(f);
});

function processFile(f) {
  if (!f.type.startsWith('image/')) { toast('Only image files allowed', 'err'); return; }
  if (f.size > 5*1024*1024) { toast('Image too large — max 5MB', 'err'); return; }
  cleanTestUsers();
  const usedKB = getUsedKB();
  if (usedKB > 4800) { toast('Storage full (' + usedKB + ' KB). Click "Clear All Data" above.', 'err'); checkStorage(); return; }
  const rd = new FileReader();
  rd.onload = ev => {
    const img  = new Image();
    img.onerror = () => toast('Could not read this image', 'err');
    img.onload  = () => {
      const c = document.createElement('canvas'); c.width = 80; c.height = 80;
      const x = c.getContext('2d');
      const m = Math.min(img.width, img.height);
      x.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, 80, 80);
      const d  = c.toDataURL('image/jpeg', .5);
      const kb = Math.round(d.length / 1024);
      if (usedKB + kb > 4900) { toast('Not enough space (' + kb + ' KB needed). Clear data first.', 'err'); checkStorage(); return; }
      upImg = d;
      document.getElementById('uzPreview').src = d;
      zone.classList.add('has-file');
      document.getElementById('uploadHint').textContent = f.name + ' — ' + kb + ' KB';
      toast('Image ready', 'ok');
    };
    img.src = ev.target.result;
  };
  rd.readAsDataURL(f);
}
document.getElementById('uzRemove').addEventListener('click', e => {
  e.stopPropagation(); upImg = null;
  document.getElementById('uzPreview').src = '';
  zone.classList.remove('has-file');
  document.getElementById('uploadHint').textContent = 'JPG, PNG — max 5MB';
  fileIn.value = '';
});

/* ════════════════════════════════════════
   USERS
════════════════════════════════════════ */
function getUsers() { const d = lsGet('ma_users'); return Array.isArray(d) ? d : []; }
function vEmail(e)  { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

/* ════════════════════════════════════════
   LOGIN
════════════════════════════════════════ */
function handleLogin() {
  clearErr();
  const em = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPassword').value;
  let ok = true;
  if (!em)          { err('loginEmail',    'loginEmailErr', 'Email is required');     ok = false; }
  else if (!vEmail(em)) { err('loginEmail','loginEmailErr', 'Invalid email format');  ok = false; }
  if (!pw)          { err('loginPassword', 'loginPassErr',  'Password is required');  ok = false; }
  else if (pw.length < 6) { err('loginPassword','loginPassErr','Minimum 6 characters'); ok = false; }
  if (!ok) return;

  const users = getUsers();
  let user = null;
  for (let i = 0; i < users.length; i++) { if (users[i].email === em) { user = users[i]; break; } }
  if (!user) { err('loginEmail', 'loginEmailErr', 'No account with this email'); return; }
  if (user.password !== pw) { err('loginPassword', 'loginPassErr', 'Incorrect password'); return; }

  user.loginCount = (user.loginCount || 0) + 1;
  user.lastLogin  = new Date().toISOString();
  lsSet('ma_users', users);
  lsSet('ma_session', {userId: user.id, at: new Date().toISOString()});
  toast('Welcome back, ' + user.name.split(' ')[0] + '!', 'ok');
  setTimeout(() => window.location.href = 'dashboard.html', 600);
}
document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

/* ════════════════════════════════════════
   SIGNUP
════════════════════════════════════════ */
function handleSignup() {
  clearErr();
  const nm = document.getElementById('signupName').value.trim();
  const em = document.getElementById('signupEmail').value.trim().toLowerCase();
  const pw = document.getElementById('signupPassword').value;
  const cf = document.getElementById('signupConfirm').value;
  let ok = true;

  if (!nm)                         { err('signupName',  'signupNameErr',    'Name is required');           ok = false; }
  else if (nm.length < 2)          { err('signupName',  'signupNameErr',    'At least 2 characters');      ok = false; }
  else if (!/^[a-zA-Z\s]+$/.test(nm)) { err('signupName','signupNameErr',  'Only letters and spaces');    ok = false; }

  if (!em)        { err('signupEmail', 'signupEmailErr', 'Email is required');    ok = false; }
  else if (!vEmail(em)) { err('signupEmail','signupEmailErr','Invalid email format'); ok = false; }
  else {
    const us = getUsers(); let dup = false;
    for (let i = 0; i < us.length; i++) { if (us[i].email === em) { dup = true; break; } }
    if (dup) { err('signupEmail', 'signupEmailErr', 'This email is already registered'); ok = false; }
  }

  let pe = '';
  if (!pw)                   pe = 'Password is required';
  else if (pw.length < 8)    pe = 'Minimum 8 characters';
  else if (!/[A-Z]/.test(pw)) pe = 'Must contain an uppercase letter (A-Z)';
  else if (!/[a-z]/.test(pw)) pe = 'Must contain a lowercase letter (a-z)';
  else if (!/[0-9]/.test(pw)) pe = 'Must contain a number (0-9)';
  if (pe) { err('signupPassword', 'signupPassErr', pe); ok = false; }

  if (!cf)      { err('signupConfirm', 'signupConfirmErr', 'Confirm your password');    ok = false; }
  else if (pw !== cf) { err('signupConfirm','signupConfirmErr','Passwords do not match'); ok = false; }
  if (!upImg) { document.getElementById('signupImgErr').textContent = 'Upload a profile picture'; ok = false; }
  if (!ok) return;

  cleanTestUsers();
  const users = getUsers();
  const nu = {
    id: 'u_' + Date.now(), name: nm, email: em, password: pw,
    avatar: upImg, trustScore: 10, loginCount: 0,
    createdAt: new Date().toISOString()
  };
  users.push(nu);
  if (!lsSet('ma_users', users)) { toast('Storage full — click "Clear All Data" above', 'err'); checkStorage(); return; }

  const vf = getUsers(); let fd = false;
  for (let j = 0; j < vf.length; j++) { if (vf[j].id === nu.id) { fd = true; break; } }
  if (!fd) { toast('Data not saved — storage issue', 'err'); checkStorage(); return; }

  nu.loginCount = 1;
  lsSet('ma_users', users);
  lsSet('ma_session', {userId: nu.id, at: new Date().toISOString()});
  toast('Account created!', 'ok');
  setTimeout(() => window.location.href = 'dashboard.html', 600);
}
document.getElementById('signupConfirm').addEventListener('keydown', e => { if (e.key === 'Enter') handleSignup(); });

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */
(function () {
  cleanTestUsers();
  checkStorage();
  const s = lsGet('ma_session');
  if (s && s.userId) {
    const u = getUsers(); let f = false;
    for (let i = 0; i < u.length; i++) { if (u[i].id === s.userId) { f = true; break; } }
    if (f) window.location.href = 'dashboard.html';
  }
})();
</script>
